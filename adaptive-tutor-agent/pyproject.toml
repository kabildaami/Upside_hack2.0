[project]
name = "adaptive-tutor-agent"
version = "0.1.0"
description = "Privacy-preserving adaptive tutor for declared learning support preferences"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "redis>=5.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "cryptography>=43",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
